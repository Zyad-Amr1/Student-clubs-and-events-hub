name: Lab 6 Assignment Checks

on:
  push:
    branches:
      - submission/lab6-final
    paths:
      - "lab6/**"
      - "lab7/**"
      - ".github/workflows/lab6-assignment.yml"
  pull_request:
    paths:
      - "lab6/**"
      - "lab7/**"
      - "docs/lab6/**"
      - ".github/workflows/lab6-assignment.yml"

jobs:
  assignment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lab7/requirements.txt

      - name: Install tools
        run: python -m pip install -r lab7/requirements.txt

      - name: Run Lab 6 unit tests with branch coverage
        working-directory: lab6
        run: |
          coverage run --branch --source=fees,grades -m pytest -q
          coverage report -m --fail-under=100

      - name: Run Lab 7 unit tests
        working-directory: lab7
        run: pytest -q

      - name: Run Behave scenarios
        working-directory: lab7
        run: behave -f progress features/registration.feature

      - name: Run Ruff on submitted implementation
        run: ruff check lab6/fees.py lab6/grades.py lab7/registration.py lab7/invoice.py lab7/features/steps/registration_steps.py
