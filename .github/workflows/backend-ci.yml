name: Backend checks

on:
  push:
    branches: [main, test/integration-rehearsal-camp-11-20261124]
    paths:
      - "backend/**"
      - "features/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "features/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: campusconnect_auth_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:55483:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d campusconnect_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          CAMPUSCONNECT_AUTH_TEST_PG_PORT: "55483"
        run: python -m pytest -q
